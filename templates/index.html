
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Person Registration | Cloud Application</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="page-container">
        <section class="registration-card">

            <div class="brand">
                <div class="brand-icon">PR</div>
                <p class="brand-name">PERSON REGISTRATION</p>
            </div>

            <h1>Create Your Registration</h1>

            <p class="subtitle">
                Enter your details in the form below.
            </p>

            <form id="registrationForm"
                  action="{{ url_for('register') }}"
                  method="POST">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter your full name"
                        maxlength="100"
                        autocomplete="name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        maxlength="150"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        maxlength="20"
                        autocomplete="tel"
                        required>
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Enter your city"
                        maxlength="100"
                        autocomplete="address-level2"
                        required>
                </div>

                <button type="submit" id="submitButton">
                    Register Now
                </button>

                <p id="formMessage"
                   class="form-message"
                   role="status"
                   aria-live="polite"></p>

            </form>

            <div class="navigation">
                <a class="view-link"
                   href="{{ url_for('list_people') }}">
                    View Registered People
                </a>
            </div>

            <p class="footer-text">
                Person Registration Application
            </p>

        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
