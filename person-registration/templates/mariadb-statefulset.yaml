apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mariadb
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ .Release.Name }}-mariadb-headless
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-mariadb
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-mariadb
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mariadb
          image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.auth.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.mariadb.auth.username | quote }}
            - name: MARIADB_PASSWORD_FILE
              value: /etc/app-secrets/db_password
            - name: MARIADB_ROOT_PASSWORD_FILE
              value: /etc/app-secrets/db_root_password
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
            - name: db-secrets
              mountPath: /etc/app-secrets
              readOnly: true
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
          startupProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: db-secrets
          secret:
            secretName: person-registration-secrets
            items:
              - key: db-password
                path: db_password
              - key: db-root-password
                path: db_root_password
  volumeClaimTemplates:
    - metadata:
        name: mariadb-data
      spec:
        accessModes:
          {{- toYaml .Values.mariadb.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.mariadb.persistence.size }}
