apiVersion: apps/v1
kind: Deployment

metadata:
  name: globalmart

spec:
  replicas: 1
  revisionHistoryLimit: 10

  selector:
    matchLabels:
      app: globalmart

  template:
    metadata:
      labels:
        app: globalmart

    spec:
      containers:
        - name: globalmart
          image: tejas85852/globalmart:placeholder

          ports:
            - containerPort: 80